<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>餐桌教練</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d1822">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="餐桌教練">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d1822; --panel:#2a2330; --line:#463c4e;
  --ink:#f6efe3; --ink2:#b9afa8;
  --accent:#f2b134; --ok:#86c98b; --warn:#ef7a52;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#app{position:fixed;inset:0;background:var(--bg)}
.screen{position:absolute;inset:0}

/* 起始頁 */
#start{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:32px 28px;max-width:480px;margin:0 auto}
#start h1{font-size:34px;line-height:1.2;margin:0;font-weight:700}
#start p{margin:0;color:var(--ink2);max-width:36em}
.primary{background:var(--accent);color:#2b1f05;border:0;border-radius:14px;min-height:52px;font-weight:700;font-size:17px;padding:0 20px}
.ghost{background:transparent;display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:0 20px}
.ghost:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--warn);min-height:1.5em}

/* 相機頁 */
#cam{background:#000}
#v{position:absolute;object-fit:cover;background:#000}
#frame{position:absolute;pointer-events:none;outline:1px solid rgba(246,239,227,.6)}
#grid{position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(to right,transparent calc(33.333% - .5px),rgba(246,239,227,.35) calc(33.333% - .5px),rgba(246,239,227,.35) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),rgba(246,239,227,.35) calc(66.666% - .5px),rgba(246,239,227,.35) calc(66.666% + .5px),transparent calc(66.666% + .5px)),
   linear-gradient(to bottom,transparent calc(33.333% - .5px),rgba(246,239,227,.35) calc(33.333% - .5px),rgba(246,239,227,.35) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),rgba(246,239,227,.35) calc(66.666% - .5px),rgba(246,239,227,.35) calc(66.666% + .5px),transparent calc(66.666% + .5px));}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;font-family:inherit}
#hintCol{flex:1;display:flex;flex-direction:column;gap:6px}
#status{font-size:13px;color:var(--ink);text-shadow:0 1px 3px #000;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
#compBtn,#ovBtn{pointer-events:auto;background:rgba(29,24,34,.85);border:1px solid var(--accent);color:var(--ink);border-radius:999px;min-height:36px;padding:0 14px;font-size:14px;font-weight:500}
.ver{font-size:12px;color:var(--ink2)}
#top{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;pointer-events:none}
#hint{background:rgba(29,24,34,.82);border-radius:14px;padding:12px 14px;font-weight:500;font-size:17px;border-left:5px solid var(--warn)}
#hint.ok{border-left-color:var(--ok)}
#hint.info{border-left-color:var(--accent)}
#score{min-width:58px;height:58px;border-radius:50%;background:rgba(29,24,34,.82);display:grid;place-items:center;font-weight:700;font-size:22px;border:3px solid var(--warn)}
#score.ok{border-color:var(--ok)}
#score.mid{border-color:var(--accent)}
#gauge{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:72px;height:72px;border-radius:50%;
  background:rgba(29,24,34,.72);border:2px solid var(--line);pointer-events:none}
#gauge::before,#gauge::after{content:"";position:absolute;background:rgba(246,239,227,.35)}
#gauge::before{left:50%;top:8px;bottom:8px;width:1px}
#gauge::after{top:50%;left:8px;right:8px;height:1px}
#bubble{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--warn);transition:transform .12s linear,background .12s}
#bubble.ok{background:var(--ok)}
#gaugeTxt{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);font-size:12px;color:var(--ink);text-shadow:0 1px 3px #000;pointer-events:none}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);
  background:linear-gradient(to top,rgba(29,24,34,.92),rgba(29,24,34,.55) 70%,transparent);
  display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"ratio ratio ratio" "seg shot back";align-items:center;gap:12px}
#ratios{grid-area:ratio;display:flex;gap:6px;justify-content:center}
#ratios button{flex:1;max-width:60px;min-height:40px;padding:0;font-size:13px;background:rgba(29,24,34,.6);border:1px solid var(--line);border-radius:10px}
#ratios button[aria-pressed="true"]{background:var(--accent);color:#2b1f05;font-weight:700;border-color:var(--accent)}
#seg{grid-area:seg;display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;justify-self:start}
#seg button{background:transparent;border:0;padding:10px 14px;min-height:44px}
#seg button[aria-pressed="true"]{background:var(--accent);color:#2b1f05;font-weight:700}
#shot{grid-area:shot;width:74px;height:74px;border-radius:50%;background:var(--ink);border:5px solid var(--bg);box-shadow:0 0 0 3px var(--ink)}
#shot:active{transform:scale(.95)}
#back{grid-area:back;justify-self:end;background:transparent;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px}

/* 結果頁 */
#res{display:flex;flex-direction:column;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);gap:14px;max-width:520px;margin:0 auto}
#picWrap{position:relative;align-self:center;line-height:0;border-radius:14px;overflow:hidden;background:#000}
#pic{display:block;max-width:100%;max-height:42vh}
#rov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#togOv{align-self:flex-start;background:transparent;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px;font-size:14px}
.big{display:flex;align-items:baseline;gap:10px}
.big b{font-size:52px;line-height:1}
.big span{color:var(--ink2)}
#advice{margin:0;font-size:18px;font-weight:500}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:64px 1fr 36px;align-items:center;gap:10px;font-size:14px}
.track{height:10px;background:var(--panel);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.fill.mid{background:var(--accent)}
.fill.low{background:var(--warn)}
.row{display:flex;gap:10px;margin-top:auto}
.row .primary,.row .ghost{flex:1}
.note{font-size:12px;color:var(--ink2);margin:0}
@media (prefers-reduced-motion:reduce){#bubble{transition:none}#shot:active{transform:none}}
</style>
</head>
<body>
<div id="app">

  <section id="start" class="screen">
    <h1>餐桌教練</h1>
    <p>拍美食時，即時告訴你手機角度、光線和構圖。會自動框出桌上的東西、挑出主角（黃框），再用箭頭告訴你主角該移到哪個黃點；點別的框可以換主角。辨識在手機上執行，照片不會上傳（第一次開啟需下載約 5MB 模型）。</p>
    <button id="go" class="primary" type="button">開始拍攝</button>
    <label class="ghost">用相簿照片測試<input id="file" type="file" accept="image/*" hidden></label>
    <p id="err" class="err" role="alert"></p>
    <p class="ver">版本 2026-10-14h</p>
  </section>

  <section id="cam" class="screen" hidden>
    <video id="v" playsinline muted autoplay></video>
    <div id="frame"><div id="grid"></div></div>
    <svg id="ov" aria-hidden="true"></svg>
    <div id="top">
      <div id="hintCol">
        <div id="hint" class="info">準備中…</div>
        <div id="status" aria-live="polite"></div>
        <div class="chips">
          <button id="compBtn" type="button">構圖：自動</button>
          <button id="ovBtn" type="button" aria-pressed="true">標示：開</button>
        </div>
      </div>
      <div id="score">--</div>
    </div>
    <div id="gauge" aria-hidden="true"><div id="bubble"></div></div>
    <div id="gaugeTxt"></div>
    <div id="bottom">
      <div id="ratios" role="group" aria-label="畫面比例">
        <button type="button" data-r="1:1">1:1</button>
        <button type="button" data-r="4:5">4:5</button>
        <button type="button" data-r="3:4">3:4</button>
        <button type="button" data-r="9:16">9:16</button>
        <button type="button" data-r="4:3">4:3</button>
        <button type="button" data-r="16:9">16:9</button>
      </div>
      <div id="seg" role="group" aria-label="拍攝角度">
        <button type="button" data-mode="top" aria-pressed="true">俯拍</button>
        <button type="button" data-mode="angle" aria-pressed="false">45°</button>
      </div>
      <button id="shot" type="button" aria-label="拍照"></button>
      <button id="back" type="button">結束</button>
    </div>
  </section>

  <section id="res" class="screen" hidden>
    <div id="picWrap"><img id="pic" alt="剛拍的照片"><svg id="rov" aria-hidden="true"></svg></div>
    <button id="togOv" type="button" hidden>隱藏構圖標示</button>
    <div class="big"><b id="rscore">0</b><span>/ 100</span></div>
    <p id="advice"></p>
    <div id="bars" class="bars"></div>
    <p id="rnote" class="note"></p>
    <div class="row">
      <button id="again" class="primary" type="button">再拍一張</button>
      <button id="home" class="ghost" type="button">回首頁</button>
    </div>
  </section>

</div>

<script>
(function(){
  var $ = function(s){return document.querySelector(s);};
  var clamp = function(x,a,b){return Math.max(a,Math.min(b,x));};
  var ema = function(p,n,a){return p==null?n:p+(n-p)*(a||.3);};

  // ===== 可調參數（實測後再微調）=====
  var TOL_DEG   = 4;     // 角度容許誤差（度）
  var DARK_MEAN = 90;    // 平均亮度低於此值 = 太暗
  var BRIGHT_MEAN = 175; // 高於此值 = 太亮
  var HI_CLIP   = 0.08;  // 過曝像素比例上限
  var BACKLIGHT = 30;    // 邊緣比中心亮多少算逆光
  var RB_WARM   = 1.55;  // R/B 高於此值 = 偏黃
  var RB_COOL   = 0.80;  // R/B 低於此值 = 偏藍
  var SHARP_GOOD = 60;   // 拉普拉斯變異數達到此值視為清晰
  var SAL_MIN   = 45;    // 與桌面差多少（色差+邊緣）才算「有東西」
  var COV_MIN   = 0.15;  // 沒認出物件時：物件像素佔比低於此 = 太空
  var COV_MAX   = 0.65;  //                高於此 = 太擠
  var BOX_MIN   = 0.20;  // 有物件框時：框面積總和低於此 = 太空
  var BOX_MAX   = 0.80;  //               高於此 = 太擠
  var BAL_TOL   = 0.10;  // 視覺重心離目標多遠才算偏
  var EDGE_CUT  = 0.30;  // 某一邊有多少比例被物件佔住 = 被切到
  var SUBJ_TOL  = 0.08;  // 主角離最近黃點多遠才提醒
  var BLOB_MIN  = 0.012; // 顏色切塊最小面積（佔畫面比例）
  var DET_SCORE = 0.30;  // AI 物件信心門檻（食物、餐具）
  var DET_SCORE_OTHER = 0.55; // 其他類別（筆電、滑鼠…）較容易誤認，門檻拉高
  // ====================================

  var RATIOS = {'1:1':1, '4:5':4/5, '3:4':3/4, '9:16':9/16, '4:3':4/3, '16:9':16/9};
  var TARGETS = [[1/3,1/3],[2/3,1/3],[1/3,2/3],[2/3,2/3],[.5,.5]];

  // AI 模型（MediaPipe，在手機上執行）
  var MP_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  var MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite';
  var ZH = {'bottle':'瓶子','wine glass':'酒杯','cup':'杯子','fork':'叉子','knife':'刀子','spoon':'湯匙','bowl':'碗盤',
    'banana':'香蕉','apple':'蘋果','sandwich':'三明治','orange':'橘子','broccoli':'花椰菜','carrot':'紅蘿蔔','hot dog':'熱狗',
    'pizza':'披薩','donut':'甜甜圈','cake':'蛋糕','potted plant':'盆栽','vase':'花瓶','book':'書','cell phone':'手機',
    'laptop':'筆電','keyboard':'鍵盤','mouse':'滑鼠','remote':'遙控器','scissors':'剪刀','teddy bear':'玩偶','clock':'時鐘',
    'tv':'螢幕','handbag':'包包','backpack':'背包','umbrella':'雨傘','toothbrush':'牙刷','sports ball':'球'};
  var SKIP = {'dining table':1,'person':1,'chair':1,'couch':1,'bed':1,'toilet':1};
  var FOOD = {'banana':1,'apple':1,'sandwich':1,'orange':1,'broccoli':1,'carrot':1,'hot dog':1,'pizza':1,'donut':1,'cake':1};
  function weightOf(name){
    if(FOOD[name]) return 2.5;
    if(name==='bowl') return 2;
    if(name==='cup'||name==='wine glass'||name==='bottle'||name==='vase'||name==='potted plant') return 1.2;
    if(name==='fork'||name==='knife'||name==='spoon') return .4;
    return .6;
  }

  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };
  var state = {screen:'start', mode:store.get('fc-mode','top'), ratio:store.get('fc-ratio','3:4'),
               frame:null, m:null, stream:null, last:null, det:[], boxes:[], mainRef:null, manual:false,
               comp:store.get('fc-comp','auto'), showOv:store.get('fc-ov','1')==='1', planSig:'', Sa:null, thrA:null};
  if(!RATIOS[state.ratio]) state.ratio='3:4';
  if(state.mode!=='top' && state.mode!=='angle') state.mode='top';
  var sm = {beta:null, gamma:null, has:false};

  window.addEventListener('deviceorientation', function(e){
    if(e.beta==null || e.gamma==null) return;
    sm.beta = ema(sm.beta, e.beta, .25);
    sm.gamma = ema(sm.gamma, e.gamma, .25);
    sm.has = true;
  });

  function show(name){
    state.screen = name;
    ['start','cam','res'].forEach(function(n){ $('#'+n).hidden = (n!==name); });
    if(name==='cam') layoutFrame();
  }

  // ===== 影像量測 =====
  // rc = 要分析的範圍（來源像素座標）。回傳光線數值 + 構圖數值，構圖座標都是相對於 rc 的 0~1。
  var ac = document.createElement('canvas');
  var ax = ac.getContext('2d', {willReadFrequently:true});
  function median(a){ a.sort(function(x,y){return x-y;}); return a[a.length>>1]; }
  function measure(src, rc){
    var W,H;
    if(rc.w>=rc.h){ W=64; H=Math.max(24,Math.round(64*rc.h/rc.w)); }
    else { H=64; W=Math.max(24,Math.round(64*rc.w/rc.h)); }
    if(ac.width!==W) ac.width=W;
    if(ac.height!==H) ac.height=H;
    ax.drawImage(src, rc.x,rc.y,rc.w,rc.h, 0,0,W,H);
    var d = ax.getImageData(0,0,W,H).data, n=W*H;
    var L = new Float32Array(n);
    var sum=0,cs=0,cn=0,es=0,en=0,hi=0,R=0,B=0;
    var br=[],bgc=[],bb=[];
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var k=y*W+x, i=k*4, r=d[i], g=d[i+1], b=d[i+2];
        var l=.299*r+.587*g+.114*b;
        L[k]=l; sum+=l; R+=r; B+=b;
        if(l>245) hi++;
        if(x>W*.25 && x<W*.75 && y>H*.25 && y<H*.75){cs+=l;cn++;} else {es+=l;en++;}
        if(x===0 || y===0 || x===W-1 || y===H-1){ br.push(r); bgc.push(g); bb.push(b); }
      }
    }
    // 桌面色 = 邊框像素的中位數；與桌面色差越大、邊緣越多，越像「物件」
    var mr=median(br), mg=median(bgc), mb=median(bb);
    var S = new Float32Array(n);
    for(var y2=0;y2<H;y2++){
      for(var x2=0;x2<W;x2++){
        var k2=y2*W+x2, i2=k2*4;
        var cd=Math.hypot(d[i2]-mr, d[i2+1]-mg, d[i2+2]-mb);
        var gx = (x2>0 && x2<W-1) ? L[k2+1]-L[k2-1] : 0;
        var gy = (y2>0 && y2<H-1) ? L[k2+W]-L[k2-W] : 0;
        S[k2] = cd + .5*(Math.abs(gx)+Math.abs(gy));
      }
    }
    var sorted = Array.prototype.slice.call(S).sort(function(a,b){return a-b;});
    var thr = Math.max(SAL_MIN, .5*sorted[Math.floor(n*.95)]);
    var ws=0,wx=0,wy=0,cnt=0,eT=0,eB=0,eL=0,eR=0;
    for(var y3=0;y3<H;y3++){
      for(var x3=0;x3<W;x3++){
        var s=S[y3*W+x3], w=Math.max(0, s-SAL_MIN*.5);
        ws+=w; wx+=w*(x3+.5)/W; wy+=w*(y3+.5)/H;
        if(s>thr){
          cnt++;
          if(y3<2) eT++; if(y3>=H-2) eB++;
          if(x3<2) eL++; if(x3>=W-2) eR++;
        }
      }
    }
    return {
      mean:sum/n, center:cs/cn, edge:es/en, hi:hi/n, rb:R/Math.max(B,1),
      cov:cnt/n, cx: ws>0 ? wx/ws : .5, cy: ws>0 ? wy/ws : .5,
      eT:eT/(2*W), eB:eB/(2*W), eL:eL/(2*H), eR:eR/(2*H),
      W:W, H:H, S:S, thr:thr
    };
  }
  function smoothM(prev,m){
    if(!prev) return m;
    var o={}; for(var k in m){ o[k] = typeof m[k]==='number' && k!=='W' && k!=='H' && k!=='thr' ? ema(prev[k], m[k], .3) : m[k]; } return o;
  }
  function sharpness(src){
    var W=160,H=Math.max(40,Math.round(160*src.height/src.width)), c=document.createElement('canvas'); c.width=W; c.height=H;
    var x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(src,0,0,W,H);
    var d=x.getImageData(0,0,W,H).data, g=new Float32Array(W*H);
    for(var i=0;i<W*H;i++){ g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]; }
    var s=0,s2=0,n=0;
    for(var yy=1;yy<H-1;yy++){
      for(var xx=1;xx<W-1;xx++){
        var k=yy*W+xx, v=4*g[k]-g[k-1]-g[k+1]-g[k-W]-g[k+W];
        s+=v; s2+=v*v; n++;
      }
    }
    var mean=s/n; return s2/n - mean*mean;
  }

  // ===== 物件框 =====
  // 框 = {x,y,w,h}（相對於比例框 0~1，可超出），label, wt（當主角的權重）, src:'ai'|'blob'
  function clipBox(b){
    var x0=clamp(b.x,0,1), y0=clamp(b.y,0,1), x1=clamp(b.x+b.w,0,1), y1=clamp(b.y+b.h,0,1);
    return {x:x0, y:y0, w:Math.max(0,x1-x0), h:Math.max(0,y1-y0)};
  }
  function visArea(b){ var c=clipBox(b); return c.w*c.h; }
  function inter(a,b){
    var x0=Math.max(a.x,b.x), y0=Math.max(a.y,b.y), x1=Math.min(a.x+a.w,b.x+b.w), y1=Math.min(a.y+a.h,b.y+b.h);
    return Math.max(0,x1-x0)*Math.max(0,y1-y0);
  }
  function center(b){ var c=clipBox(b); return {x:c.x+c.w/2, y:c.y+c.h/2}; }

  function toBoxes(dets, rc){
    var out=[];
    (dets||[]).forEach(function(d){
      var c=d.categories && d.categories[0]; if(!c) return;
      var name=c.categoryName; if(SKIP[name]) return;
      if(weightOf(name)<1 && name!=='fork' && name!=='knife' && name!=='spoon' && c.score<DET_SCORE_OTHER) return;
      var bb=d.boundingBox;
      var b={x:(bb.originX-rc.x)/rc.w, y:(bb.originY-rc.y)/rc.h, w:bb.width/rc.w, h:bb.height/rc.h,
             label:ZH[name]||'物件', wt:weightOf(name), src:'ai'};
      if(b.w*b.h<=0 || visArea(b)/(b.w*b.h) < .3) return;
      out.push(b);
    });
    return out;
  }

  // AI 沒認出的東西：把「不像桌面」的像素連成塊，每塊一個框
  function blobs(m){
    var W=m.W, H=m.H, S=m.S, thr=m.thr, n=W*H, seen=new Uint8Array(n), q=new Int32Array(n), out=[];
    for(var k=0;k<n;k++){
      if(seen[k] || S[k]<=thr) continue;
      var head=0, tail=0, x0=W, y0=H, x1=0, y1=0, cnt=0;
      q[tail++]=k; seen[k]=1;
      while(head<tail){
        var p=q[head++], px=p%W, py=(p-px)/W; cnt++;
        if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py;
        if(px>0   && !seen[p-1] && S[p-1]>thr){ seen[p-1]=1; q[tail++]=p-1; }
        if(px<W-1 && !seen[p+1] && S[p+1]>thr){ seen[p+1]=1; q[tail++]=p+1; }
        if(py>0   && !seen[p-W] && S[p-W]>thr){ seen[p-W]=1; q[tail++]=p-W; }
        if(py<H-1 && !seen[p+W] && S[p+W]>thr){ seen[p+W]=1; q[tail++]=p+W; }
      }
      if(cnt < n*BLOB_MIN) continue;
      var b={x:x0/W, y:y0/H, w:(x1-x0+1)/W, h:(y1-y0+1)/H, label:'物件', wt:1.5, src:'blob'};
      if(b.w*b.h > .7) continue;   // 幾乎整個畫面 = 多半是桌面判斷錯，不採用
      out.push(b);
    }
    return out;
  }
  function mergeBoxes(ai, bl){
    var out=ai.slice();
    bl.forEach(function(b){
      var dup = ai.some(function(a){ var it=inter(a,b); return it > .4*b.w*b.h || it > .6*a.w*a.h; });
      if(!dup) out.push(b);
    });
    return out;
  }
  // 追蹤：同一樣東西沿用同一個框、位置平滑移動；連續出現 3 次才顯示，短暫沒偵測到先保留
  var tracks=[], trackId=0, TRACK_KEEP=6;
  function iou(a,b){ var it=inter(a,b); return it/Math.max(1e-6, a.w*a.h+b.w*b.h-it); }
  function trackBoxes(boxes){
    var used=[];
    boxes.forEach(function(b){
      var bi=-1, bv=.2;
      tracks.forEach(function(t,i){
        if(used[i]) return;
        if(t.src==='ai' && b.src==='ai' && t.label!==b.label) return;
        var u=iou(t,b); if(u>bv){ bv=u; bi=i; }
      });
      if(bi>=0){
        var t=tracks[bi], a=.35; used[bi]=true;
        t.x=ema(t.x,b.x,a); t.y=ema(t.y,b.y,a); t.w=ema(t.w,b.w,a); t.h=ema(t.h,b.h,a);
        t.hits++; t.miss=0;
        if(b.src==='ai'){ t.src='ai'; t.label=b.label; t.wt=b.wt; t.aiMiss=0; }
        else if(t.src==='ai' && ++t.aiMiss>12){ t.src='blob'; t.label='物件'; t.wt=1.5; }
      } else {
        tracks.push({x:b.x, y:b.y, w:b.w, h:b.h, label:b.label, wt:b.wt, src:b.src, hits:1, miss:0, aiMiss:0, id:++trackId});
        used[tracks.length-1]=true;
      }
    });
    tracks.forEach(function(t,i){ if(!used[i]) t.miss++; });
    tracks=tracks.filter(function(t){ return t.miss<=TRACK_KEEP; });
    var shown=tracks.filter(function(t){ if(t.hits>=3) t.ok=true; return t.ok; });
    // 被另一個框大半包住的小框 = 同一樣東西的碎片，不顯示
    return shown.filter(function(t){
      return !shown.some(function(o){ return o!==t && o.w*o.h>t.w*t.h && inter(o,t)>.6*t.w*t.h; });
    });
  }
  function resetTracks(){ tracks=[]; state.Sa=null; state.thrA=null; state.planSig=''; }

  // 選主角：預設挑「大又像食物」的；手動點過就盡量跟住那一個
  function pickMain(boxes){
    boxes.forEach(function(b){ b.main=false; });
    if(!boxes.length) return null;
    var sc=boxes.map(function(b){ return visArea(b)*b.wt; });
    var best=0; sc.forEach(function(s,i){ if(s>sc[best]) best=i; });
    if(state.mainRef){
      var j=-1, jd=.2;
      boxes.forEach(function(b,i){ var c=center(b), dd=Math.hypot(c.x-state.mainRef.x, c.y-state.mainRef.y); if(dd<jd){ jd=dd; j=i; } });
      if(j>=0 && (state.manual || sc[j]>=.7*sc[best])) best=j;
      else if(j<0) state.manual=false;
    }
    boxes[best].main=true;
    state.mainRef=center(boxes[best]);
    return boxes[best];
  }

  // ===== 構圖範本 =====
  // 每種構圖有幾組候選點位（0~1），挑「東西要移動最少」的那組
  var COMP = {
    center:  {name:'中心構圖', sets:[[[.5,.5]]]},
    thirds:  {name:'三分法', sets:[[[1/3,1/3]],[[2/3,1/3]],[[1/3,2/3]],[[2/3,2/3]]]},
    diagonal:{name:'對角線構圖', sets:[[[1/3,1/3],[2/3,2/3]],[[2/3,1/3],[1/3,2/3]]]},
    triangle:{name:'三角構圖', sets:[[[.5,.28],[.27,.7],[.73,.7]],[[.27,.3],[.73,.3],[.5,.72]],[[.3,.27],[.72,.5],[.3,.73]],[[.7,.27],[.28,.5],[.7,.73]]]}
  };
  var COMP_ORDER = ['auto','center','thirds','diagonal','triangle'];
  if(COMP_ORDER.indexOf(state.comp)<0) state.comp='auto';
  var NUM = ['①','②','③'];
  function perms(a){
    if(a.length<=1) return [a];
    var out=[]; a.forEach(function(x,i){ perms(a.slice(0,i).concat(a.slice(i+1))).forEach(function(p){ out.push([x].concat(p)); }); });
    return out;
  }
  // 回傳 {key,name,slots,asg:[{box,slot,d}]}；asg 依重要性排序（主角在第一個）
  function planComp(boxes){
    if(!boxes.length) return null;
    var rank=function(b){ return (b.main?1e3:0)+visArea(b)*b.wt; };
    var objs=boxes.slice().sort(function(a,b){ return rank(b)-rank(a); });
    var key=state.comp;
    if(key==='auto') key = objs.length===1 ? (state.mode==='top'?'center':'thirds') : (objs.length===2 ? 'diagonal' : 'triangle');
    var best=null, prev=null;
    COMP[key].sets.forEach(function(slots, si){
      var k=Math.min(objs.length, slots.length);
      perms(slots.map(function(_,i){return i;})).forEach(function(p){
        var cost=0, asg=[], sig=key+'|'+si;
        for(var i=0;i<k;i++){
          var c=center(objs[i]), t=slots[p[i]], d=Math.hypot(c.x-t[0], c.y-t[1]);
          cost+=d*(objs[i].main?1.5:1); asg.push({box:objs[i], slot:p[i], d:d});
          sig+='|'+(objs[i].id||i)+':'+p[i];
        }
        var cand={key:key, name:COMP[key].name, slots:slots, asg:asg, cost:cost, sig:sig};
        if(!best || cost<best.cost) best=cand;
        if(sig===state.planSig) prev=cand;
      });
    });
    // 遲滯：之前的安排只要沒有明顯比較差，就沿用，避免點位跳來跳去
    if(prev && prev.cost <= best.cost*1.25 + .02) best=prev;
    state.planSig=best.sig;
    return best;
  }

  function dirWord(dx,dy){
    var h = dx>.03 ? '右' : (dx<-.03 ? '左' : ''), vv = dy<-.03 ? '上' : (dy>.03 ? '下' : '');
    return h+vv;
  }

  // ===== 評估 =====
  // 回傳 {score, parts:{angle,light,comp}, issues:[{pen,msg}], tilt, plan}
  function evaluate(m, ori, opt){
    opt = opt||{};
    var issues=[], pa=0, pl=0, pc=0, tilt=null, plan=null;

    // 角度
    if(ori){
      var target = state.mode==='top' ? 0 : 45;
      var ep = ori.beta - target, er = ori.gamma;
      tilt = Math.hypot(ep, er);
      pa = Math.min(35, tilt*3.5);
      if(tilt > TOL_DEG){
        if(Math.abs(ep) >= Math.abs(er)){
          if(state.mode==='top' && ep>=25 && ep<=65) issues.push({pen:pa, msg:'現在是「俯拍」模式（要平放）。想拍 45° 請點下方「45°」'});
          else if(state.mode==='top') issues.push({pen:pa, msg:'手機再放平一點，鏡頭正對桌面'});
          else issues.push({pen:pa, msg: ep>0 ? '鏡頭再往下壓一點' : '鏡頭再往前抬一點'});
        } else {
          issues.push({pen:pa, msg:'手機有點歪，轉正'});
        }
      }
    }

    // 光線與色溫
    if(m){
      var dev = m.mean<DARK_MEAN ? DARK_MEAN-m.mean : (m.mean>BRIGHT_MEAN ? m.mean-BRIGHT_MEAN : 0);
      var p1 = Math.min(20, dev*.5);
      var p2 = m.hi>HI_CLIP ? Math.min(10,(m.hi-HI_CLIP)*100) : 0;
      var p3 = (m.edge-m.center)>BACKLIGHT ? Math.min(10,(m.edge-m.center-BACKLIGHT)/3) : 0;
      var p4 = m.rb>RB_WARM ? Math.min(8,(m.rb-RB_WARM)*20) : (m.rb<RB_COOL ? Math.min(8,(RB_COOL-m.rb)*20) : 0);
      pl = Math.min(30, p1+p2+p3+p4);
      if(m.mean<DARK_MEAN) issues.push({pen:p1+2, msg:'光線太暗，移到窗邊或開亮一點'});
      if(p3>0) issues.push({pen:p3+2, msg:'逆光了，換個位置讓光從側面來'});
      if(m.mean>BRIGHT_MEAN || p2>0) issues.push({pen:p1+p2+2, msg:'太亮或局部過曝，避開直射光'});
      if(p4>0) issues.push({pen:p4+1, msg: m.rb>RB_WARM ? '畫面偏黃，換白光或靠窗拍' : '畫面偏藍，遠離冷色螢幕光'});
    }

    // 構圖
    var boxes = opt.boxes || [];
    if(boxes.length){
      var pf=0, pb=0, pe=0, ps=0, po=0;
      var main = boxes.filter(function(b){return b.main;})[0];
      // 留白
      var area=0; boxes.forEach(function(b){ area+=visArea(b); });
      if(area<BOX_MIN){ pf=Math.min(7,(BOX_MIN-area)*50); issues.push({pen:pf+1, msg:'畫面太空：靠近一點，或多擺幾樣'}); }
      else if(area>BOX_MAX){ pf=Math.min(7,(area-BOX_MAX)*25); issues.push({pen:pf+1, msg:'太擠了：退後一點，或拿掉一兩樣'}); }
      // 切邊（主角被切比配角嚴重）
      boxes.forEach(function(b){
        var side = b.x<.01 ? ['左','右'] : b.x+b.w>.99 ? ['右','左'] : b.y<.01 ? ['上','下'] : b.y+b.h>.99 ? ['下','上'] : null;
        if(!side) return;
        var p = b.main ? 10 : 4;
        pe = Math.max(pe, p);
        issues.push({pen:p+1, msg: (b.main?'主角「'+b.label+'」':'「'+b.label+'」')+'被'+side[0]+'邊切到：退後一點，或把它往'+side[1]+'移'});
      });
      // 重疊
      for(var i=0;i<boxes.length;i++) for(var j=i+1;j<boxes.length;j++){
        var a=boxes[i], b=boxes[j], it=inter(a,b);
        if(it > .5*Math.min(a.w*a.h, b.w*b.h) && !(a.src==='ai' && b.src==='ai' && (a.label==='碗盤'||b.label==='碗盤'))){
          po=Math.max(po,3);
          issues.push({pen:3, msg:'「'+a.label+'」和「'+b.label+'」疊在一起，分開一點'});
        }
      }
      // 平衡：所有框以面積加權的重心
      if(boxes.length>1){
        var ws=0,wx=0,wy=0;
        boxes.forEach(function(b){ var c=center(b), w=visArea(b); ws+=w; wx+=w*c.x; wy+=w*c.y; });
        var ty = state.mode==='top' ? .5 : .55, bx=wx/ws-.5, by=wy/ws-ty, off=Math.max(Math.abs(bx),Math.abs(by));
        if(off>BAL_TOL){
          pb=Math.min(8,(off-BAL_TOL)*60);
          var side2 = Math.abs(bx)>=Math.abs(by) ? (bx<0?['左','右']:['右','左']) : (by<0?['上','下']:['下','上']);
          issues.push({pen:pb, msg:'東西都偏'+side2[0]+'：手機往'+side2[0]+'移，或在'+side2[1]+'邊補個配角'});
        }
      }
      // 構圖範本：每樣東西各自該去的點
      plan=planComp(boxes);
      if(plan){
        var sumd=0, worst=null;
        plan.asg.forEach(function(g){
          var e=Math.max(0,g.d-SUBJ_TOL)*(g.box.main?1.5:1); sumd+=e;
          if(g.d>SUBJ_TOL && (!worst || e>worst.e)) worst={g:g, e:e};
        });
        ps=Math.min(12, sumd*45);
        if(worst){
          var g=worst.g, gc=center(g.box), gt=plan.slots[g.slot], rk=plan.asg.indexOf(g);
          var who = g.box.main ? '主角「'+g.box.label+'」' : '「'+g.box.label+'」';
          var tail = plan.asg.length===1 ? '（或手機往'+dirWord(gc.x-gt[0], gc.y-gt[1])+'移）' : '';
          issues.push({pen:ps+1, msg:plan.name+'：把'+who+'往'+dirWord(gt[0]-gc.x, gt[1]-gc.y)+'移到 '+NUM[rk]+' 號點'+tail});
        }
        var miss=plan.slots.length-plan.asg.length;
        if(miss>0) issues.push({pen:.8, msg:plan.name+'還差 '+miss+' 樣：在「＋」的位置補個配角', info:true});
      }
      pc = Math.min(25, pf+pb+pe+ps+po);
    } else if(m){
      // 沒有任何框：退回用整體像素估計
      var qf=0, qb=0, qe=0;
      if(m.cov<COV_MIN){ qf=Math.min(7,(COV_MIN-m.cov)*60); issues.push({pen:qf+1, msg:'畫面太空：靠近一點，或多擺幾樣'}); }
      else if(m.cov>COV_MAX){ qf=Math.min(7,(m.cov-COV_MAX)*30); issues.push({pen:qf+1, msg:'太擠了：退後一點，或拿掉一兩樣'}); }
      if(m.cov>=.05){
        var ty2 = state.mode==='top' ? .5 : .55, bx2=m.cx-.5, by2=m.cy-ty2, off2=Math.max(Math.abs(bx2),Math.abs(by2));
        if(off2>BAL_TOL){
          qb=Math.min(8,(off2-BAL_TOL)*60);
          var s3 = Math.abs(bx2)>=Math.abs(by2) ? (bx2<0?['左','右']:['右','左']) : (by2<0?['上','下']:['下','上']);
          issues.push({pen:qb+1, msg:'東西都偏'+s3[0]+'：手機往'+s3[0]+'移，或在'+s3[1]+'邊補個配角'});
        }
        var sides=[['上',m.eT],['下',m.eB],['左',m.eL],['右',m.eR]];
        sides.sort(function(a,b){return b[1]-a[1];});
        if(sides[0][1]>EDGE_CUT){
          qe=Math.min(6,(sides[0][1]-EDGE_CUT)*25);
          issues.push({pen:qe+1, msg:sides[0][0]+'邊有東西被切到：退後一點，或手機往'+sides[0][0]+'移'});
        }
      }
      pc = Math.min(25, qf+qb+qe);
    }

    issues.sort(function(a,b){return b.pen-a.pen;});
    var total = clamp(Math.round(100-pa-pl-pc),0,100);
    return {
      score: total, issues: issues, tilt: tilt, plan: plan,
      parts: {
        angle: ori ? Math.round(100-pa/35*100) : null,
        light: m ? Math.round(100-pl/30*100) : null,
        comp: m ? Math.round(100-pc/25*100) : null
      }
    };
  }

  // ===== 疊圖：構圖輔助線、物件框、編號點位、箭頭 =====
  // X/Y 把 0~1 座標換成 svg 座標；u = 線寬/字級基準
  function overlaySVG(boxes, plan, X, Y, u){
    var s='<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">'+
          '<path d="M0,0 L10,5 L0,10 z" fill="#f2b134"/></marker></defs>';
    var dash='stroke="#f2b134" stroke-width="'+u*2+'" stroke-dasharray="'+u*8+' '+u*6+'" fill="none" opacity=".9"';
    var rankOf=function(b){ if(!plan) return -1; for(var i=0;i<plan.asg.length;i++) if(plan.asg[i].box===b) return i; return -1; };
    // 輔助線
    if(plan){
      var P=plan.slots;
      if(plan.key==='triangle'){
        s+='<polygon points="'+P.map(function(p){return X(p[0])+','+Y(p[1]);}).join(' ')+'" '+dash+'/>';
      } else if(plan.key==='diagonal'){
        var tlbr=(P[1][0]-P[0][0])*(P[1][1]-P[0][1])>0;
        s+='<line x1="'+X(tlbr?0:1)+'" y1="'+Y(0)+'" x2="'+X(tlbr?1:0)+'" y2="'+Y(1)+'" '+dash+'/>';
      } else if(plan.key==='center'){
        s+='<circle cx="'+X(.5)+'" cy="'+Y(.5)+'" r="'+u*40+'" '+dash+'/>';
      }
    }
    // 物件框（主角最後畫，蓋在最上面）
    var order=boxes.filter(function(b){return !b.main;}).concat(boxes.filter(function(b){return b.main;}));
    order.forEach(function(b){
      var c=clipBox(b); if(c.w<=0||c.h<=0) return;
      var x=X(c.x), y=Y(c.y), w=X(c.x+c.w)-x, h=Y(c.y+c.h)-y, rk=rankOf(b);
      s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+u*2+'" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="'+u*(b.main?4.5:2.6)+'"/>';
      s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+u*2+'" fill="none" stroke="'+(b.main?'#f2b134':'rgba(246,239,227,.9)')+'" stroke-width="'+u*(b.main?3:1.2)+'"/>';
      s+=tag(x, y, (rk>=0?NUM[rk]:'')+(b.main?'主角・':'')+b.label, b.main, u);
    });
    if(plan){
      // 箭頭：每樣東西 → 它的點
      plan.asg.forEach(function(g){
        if(g.d<=SUBJ_TOL) return;
        var c=center(g.box), t=plan.slots[g.slot];
        s+='<circle cx="'+X(c.x)+'" cy="'+Y(c.y)+'" r="'+u*3+'" fill="#f2b134"/>';
        s+='<line x1="'+X(c.x)+'" y1="'+Y(c.y)+'" x2="'+X(t[0])+'" y2="'+Y(t[1])+'" stroke="rgba(0,0,0,.5)" stroke-width="'+u*5+'" stroke-linecap="round"/>';
        s+='<line x1="'+X(c.x)+'" y1="'+Y(c.y)+'" x2="'+X(t[0])+'" y2="'+Y(t[1])+'" stroke="#f2b134" stroke-width="'+u*3+'" stroke-linecap="round" marker-end="url(#ah)"/>';
      });
      // 點位：有東西的標編號（到位變綠），空的標 ＋
      plan.slots.forEach(function(t,i){
        var g=null; plan.asg.forEach(function(q){ if(q.slot===i) g=q; });
        var ok=g && g.d<=SUBJ_TOL, r=u*11;
        s+='<circle cx="'+X(t[0])+'" cy="'+Y(t[1])+'" r="'+r+'" fill="'+(ok?'#86c98b':'rgba(29,24,34,.8)')+'" stroke="#f2b134" stroke-width="'+u*2+'"/>';
        s+='<text x="'+X(t[0])+'" y="'+(Y(t[1])+u*5)+'" font-size="'+u*14+'" font-weight="700" text-anchor="middle" fill="'+(ok?'#1d1822':'#f2b134')+'">'+(g?plan.asg.indexOf(g)+1:'＋')+'</text>';
      });
    }
    return s;
  }
  function tag(x, y, text, main, u){
    var fs=u*12, w=text.length*fs+u*10, h=fs+u*8, ty=Math.max(0, y-h);
    return '<rect x="'+x+'" y="'+ty+'" width="'+w+'" height="'+h+'" rx="'+u*3+'" fill="'+(main?'#f2b134':'rgba(29,24,34,.85)')+'"/>'+
           '<text x="'+(x+u*5)+'" y="'+(ty+h-u*5)+'" font-size="'+fs+'" font-weight="700" fill="'+(main?'#2b1f05':'#f6efe3')+'">'+text+'</text>';
  }

  // ===== AI 物件辨識（MediaPipe） =====
  var det=null, detState='idle', detTs=0, detBusy=false, detPromise=null, detErr='', lastErr='';
  window.addEventListener('error', function(e){ lastErr=String(e.message||'錯誤'); });
  window.addEventListener('unhandledrejection', function(e){ lastErr=String(e.reason && e.reason.message || e.reason); });
  function ensureDetector(){
    if(detPromise) return detPromise;
    // 防當機：載入前先記一筆，成功或失敗才清掉。若上次載到一半瀏覽器當掉，這次跳過 AI（下次再試）
    if(store.get('fc-det-loading','0')==='1'){
      store.set('fc-det-loading','0');
      detErr='上次載入時瀏覽器當掉，這次先跳過；重新開啟頁面會再試';
      detState='failed';
      detPromise=Promise.resolve(null);
      return detPromise;
    }
    store.set('fc-det-loading','1');
    detState='loading';
    var retry=function(fn){ return fn().catch(function(){ return new Promise(function(r){ setTimeout(r,2000); }).then(fn); }); };
    detPromise = retry(function(){ return import(MP_URL+'/vision_bundle.mjs'); }).then(function(mp){
      return mp.FilesetResolver.forVisionTasks(MP_URL+'/wasm').then(function(fs){
        var mk=function(dl){ return mp.ObjectDetector.createFromOptions(fs, {
          baseOptions:{modelAssetPath:MODEL_URL, delegate:dl}, runningMode:'VIDEO', scoreThreshold:DET_SCORE, maxResults:12}); };
        // GPU 模式在部分裝置會「不報錯但回傳空結果」，固定用 CPU（模型小，夠快）
        return retry(function(){ return mk('CPU'); });
      });
    }).then(function(d){ store.set('fc-det-loading','0'); det=d; detState='ready'; return d; })
      .catch(function(e){ store.set('fc-det-loading','0'); console.warn('detector', e); detErr=String(e && e.message || e); detState='failed'; return null; });
    return detPromise;
  }
  function detectTick(){
    if(state.screen!=='cam' || !det || detBusy || !v.videoWidth || !state.frame) return;
    var now=performance.now(); if(now<=detTs) now=detTs+1; detTs=now;
    try{ state.det = toBoxes(det.detectForVideo(v, now).detections, cropRect()); }catch(e){ console.warn(e); lastErr='辨識：'+(e && e.message || e); }
  }

  // ===== 比例框 =====
  var v=$('#v'), cam=$('#cam'), frameEl=$('#frame'), ov=$('#ov'), st=$('#status');

  // 框在畫面上的位置（相機頁座標）
  // 鏡頭畫面只顯示在框裡，框外全黑：看到的就是拍到的。
  // 盡量放在上方提示與下方按鈕之間；放不下（例如 9:16）才鋪滿、讓按鈕蓋在畫面上。
  var TOP_RES=150, BOT_RES=150;
  function layoutFrame(){
    var W=cam.clientWidth, H=cam.clientHeight, r=RATIOS[state.ratio];
    var aw=W, ah=H-TOP_RES-BOT_RES, fw=aw, fh=aw/r, top=TOP_RES;
    if(fh>ah){ fh=ah; fw=ah*r; }
    if(fw<W*.8){ fw=W; fh=W/r; if(fh>H){ fh=H; fw=H*r; } top=(H-fh)/2; }
    else top=TOP_RES+(ah-fh)/2;
    state.frame = {x:(W-fw)/2, y:top, w:fw, h:fh};
    [frameEl, v].forEach(function(e){
      e.style.left=state.frame.x+'px'; e.style.top=state.frame.y+'px';
      e.style.width=fw+'px'; e.style.height=fh+'px';
    });
    ov.setAttribute('viewBox','0 0 '+W+' '+H);
  }
  // 框裡顯示的是影片置中裁成框比例的部分（object-fit:cover），拍照就裁同一塊
  function cropRect(){
    var vw=v.videoWidth, vh=v.videoHeight, r=state.frame.w/state.frame.h;
    var w=vw, h=vw/r;
    if(h>vh){ h=vh; w=vh*r; }
    return {x:(vw-w)/2, y:(vh-h)/2, w:w, h:h};
  }
  function setRatio(r){
    state.ratio=r; store.set('fc-ratio', r);
    state.m=null; state.det=[]; state.mainRef=null; state.manual=false; resetTracks();
    document.querySelectorAll('#ratios button').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.r===r ? 'true':'false'); });
    if(state.screen==='cam') layoutFrame();
  }
  function setMode(md){
    state.mode=md; store.set('fc-mode', md);
    document.querySelectorAll('#seg button').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.mode===md ? 'true':'false'); });
  }

  // ===== 即時迴圈 =====
  var hint=$('#hint'), scoreEl=$('#score'), bubble=$('#bubble'), gauge=$('#gauge'), gtxt=$('#gaugeTxt');

  function statusText(boxes){
    var pre='';
    if(detState==='loading') pre='物件辨識模型下載中（第一次約 5MB）…';
    else if(detState==='failed') pre='辨識模型載入失敗（'+detErr.slice(0,50)+'），先用顏色估計。';
    var names=boxes.map(function(b){ return b.label; });
    var body = names.length ? '找到 '+names.length+' 樣：'+names.join('、')+'。點框可換主角' : '還沒找到物件';
    return pre+body+(lastErr ? '｜錯誤：'+lastErr.slice(0,60) : '');
  }
  function compLabel(plan){
    return state.comp==='auto' ? '構圖：自動'+(plan?'・'+plan.name:'')+' ▸' : '構圖：'+COMP[state.comp].name+' ▸';
  }
  function syncOvBtn(){
    var b=$('#ovBtn'); b.textContent = state.showOv ? '標示：開' : '標示：關'; b.setAttribute('aria-pressed', state.showOv?'true':'false');
  }
  syncOvBtn();
  $('#ovBtn').addEventListener('click', function(){
    state.showOv=!state.showOv; store.set('fc-ov', state.showOv?'1':'0'); syncOvBtn(); tick();
  });
  $('#compBtn').addEventListener('click', function(){
    state.comp = COMP_ORDER[(COMP_ORDER.indexOf(state.comp)+1)%COMP_ORDER.length];
    store.set('fc-comp', state.comp);
    tick();
  });

  function tick(){
    if(state.screen!=='cam' || !v.videoWidth || !state.frame) return;
    var raw = measure(v, cropRect());
    if(!state.Sa || state.Sa.length!==raw.S.length){ state.Sa=new Float32Array(raw.S); state.thrA=raw.thr; }
    else { for(var i=0;i<raw.S.length;i++) state.Sa[i]+=(raw.S[i]-state.Sa[i])*.35; state.thrA=ema(state.thrA, raw.thr, .2); }
    state.m = smoothM(state.m, raw);
    var boxes = trackBoxes(mergeBoxes(state.det, blobs({W:raw.W, H:raw.H, S:state.Sa, thr:state.thrA})));
    pickMain(boxes);
    state.boxes = boxes;
    var ori = sm.has ? {beta:sm.beta, gamma:sm.gamma} : null;
    var ev = evaluate(state.m, ori, {boxes:boxes});
    state.last = ev;

    var top = ev.issues[0];
    if(top){
      hint.textContent = top.msg;
      hint.className = '';
    } else {
      hint.textContent = '很好，現在拍';
      hint.className = 'ok';
    }
    scoreEl.textContent = ev.score;
    scoreEl.className = ev.score>=80 ? 'ok' : (ev.score>=60 ? 'mid' : '');
    st.textContent = statusText(boxes);
    $('#compBtn').textContent = compLabel(ev.plan);

    // 水平儀
    if(ori){
      gauge.hidden = false; gtxt.hidden = false;
      var target = state.mode==='top' ? 0 : 45;
      var gx = clamp(ori.gamma/15,-1,1)*26, gy = clamp((ori.beta-target)/15,-1,1)*26;
      bubble.style.transform = 'translate('+gx.toFixed(1)+'px,'+gy.toFixed(1)+'px)';
      var okTilt = ev.tilt<=TOL_DEG;
      bubble.className = okTilt ? 'ok' : '';
      gtxt.textContent = '傾斜 '+Math.round(ev.tilt)+'°';
    } else {
      gauge.hidden = true; gtxt.hidden = true;
    }
    var f=state.frame;
    ov.style.display = state.showOv ? '' : 'none';
    ov.innerHTML = overlaySVG(boxes, ev.plan, function(x){return f.x+x*f.w;}, function(y){return f.y+y*f.h;}, 1);
  }

  // 點某個框 = 指定它當主角；點空白 = 交回自動挑選
  cam.addEventListener('pointerdown', function(e){
    if(e.target.closest('#bottom') || e.target.closest('#top') || !state.frame) return;
    var r=cam.getBoundingClientRect(), f=state.frame;
    var fx=(e.clientX-r.left-f.x)/f.w, fy=(e.clientY-r.top-f.y)/f.h;
    if(fx<0||fy<0||fx>1||fy>1) return;
    var hit=null;
    state.boxes.forEach(function(b){
      var c=clipBox(b);
      if(fx>=c.x && fx<=c.x+c.w && fy>=c.y && fy<=c.y+c.h && (!hit || c.w*c.h < visArea(hit))) hit=b;
    });
    if(hit){ state.mainRef=center(hit); state.manual=true; }
    else { state.manual=false; state.mainRef=null; }
    tick();
  });
  document.querySelectorAll('#ratios button').forEach(function(b){
    b.addEventListener('click', function(){ setRatio(b.dataset.r); });
  });
  document.querySelectorAll('#seg button').forEach(function(b){
    b.addEventListener('click', function(){ setMode(b.dataset.mode); });
  });
  setRatio(state.ratio); setMode(state.mode);
  setInterval(tick, 150);
  setInterval(detectTick, 300);
  window.addEventListener('resize', function(){ if(state.screen==='cam'){ layoutFrame(); tick(); } });

  // ===== 啟動相機 =====
  $('#go').addEventListener('click', async function(){
    $('#err').textContent='';
    try{
      if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
        try{ await DeviceOrientationEvent.requestPermission(); }catch(e){}
      }
    }catch(e){}
    ensureDetector();
    try{
      state.stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false
      });
      v.srcObject = state.stream;
      await v.play();
      state.m=null;
      show('cam');
    }catch(e){
      $('#err').textContent = '無法開啟相機，可能被瀏覽器擋住。請用手機直接開這個頁面，或先用下方相簿照片測試。';
    }
  });

  function stopCam(){
    if(state.stream){ state.stream.getTracks().forEach(function(t){t.stop();}); state.stream=null; }
  }
  $('#back').addEventListener('click', function(){ stopCam(); show('start'); });

  // ===== 拍照與結果 =====
  function barRow(label, val){
    var cls = val>=80 ? '' : (val>=60 ? 'mid' : 'low');
    var row=document.createElement('div'); row.className='bar';
    var a=document.createElement('span'); a.textContent=label;
    var t=document.createElement('div'); t.className='track';
    var f=document.createElement('div'); f.className='fill '+cls; f.style.width=val+'%'; t.appendChild(f);
    var n=document.createElement('span'); n.textContent=val;
    row.appendChild(a); row.appendChild(t); row.appendChild(n);
    return row;
  }

  function finish(src, imgUrl, opt){
    opt = opt||{};
    var m = measure(src, {x:0, y:0, w:src.width, h:src.height});
    var ori = (!opt.noAngle && sm.has) ? {beta:sm.beta, gamma:sm.gamma} : null;
    var boxes = opt.boxes || [];
    var ev = evaluate(m, ori, {boxes:boxes});
    var sh = clamp(Math.round(sharpness(src)/SHARP_GOOD*100),0,100);

    var parts = [];
    if(ev.parts.angle!=null) parts.push(['角度', ev.parts.angle]);
    if(ev.parts.light!=null) parts.push(['光線', ev.parts.light]);
    if(ev.parts.comp!=null)  parts.push(['構圖', ev.parts.comp]);
    parts.push(['清晰度', sh]);
    var total = Math.round(parts.reduce(function(s,p){return s+p[1];},0)/parts.length);

    var advice;
    if(sh<50) advice = '畫面偏糊，穩住手機、等對焦完成再按快門';
    else if(ev.issues.length) advice = '下次先改這點：'+ev.issues[0].msg;
    else advice = '技術面都在水準內，可以專心想擺盤和配角';
    if(ev.plan) advice = '建議構圖：'+ev.plan.name+'。'+advice;

    $('#pic').src = imgUrl;
    var W=src.width, H=src.height, rov=$('#rov');
    rov.setAttribute('viewBox','0 0 '+W+' '+H);
    rov.innerHTML = overlaySVG(boxes, ev.plan, function(x){return x*W;}, function(y){return y*H;}, Math.max(W,H)/400);
    rov.style.display = boxes.length ? '' : 'none';
    $('#togOv').hidden = !boxes.length;
    $('#togOv').textContent = '隱藏構圖標示';
    $('#rscore').textContent = total;
    $('#advice').textContent = advice;
    var bars=$('#bars'); bars.textContent='';
    parts.forEach(function(p){ bars.appendChild(barRow(p[0],p[1])); });
    var modeTxt = ev.parts.angle!=null ? '本次以「'+(state.mode==='top'?'俯拍（手機平放）':'45°')+'」模式評角度，比例 '+state.ratio+'。' : '';
    $('#rnote').textContent = opt.note || (modeTxt+'評分只看技術面（角度、光線、構圖、清晰度），不評好不好看。長按照片可儲存（儲存的照片不含標示）。');
    show('res');
  }
  $('#togOv').addEventListener('click', function(){
    var rov=$('#rov'), off = rov.style.display!=='none';
    rov.style.display = off ? 'none' : '';
    this.textContent = off ? '顯示構圖標示' : '隱藏構圖標示';
  });

  $('#shot').addEventListener('click', function(){
    if(!v.videoWidth || !state.frame) return;
    var rc=cropRect(), c=document.createElement('canvas');
    c.width=Math.round(rc.w); c.height=Math.round(rc.h);
    c.getContext('2d').drawImage(v, rc.x,rc.y,rc.w,rc.h, 0,0,c.width,c.height);
    var boxes = state.boxes.map(function(b){ return Object.assign({}, b); });
    finish(c, c.toDataURL('image/jpeg',.92), {boxes:boxes});
  });

  $('#file').addEventListener('change', async function(e){
    var f=e.target.files && e.target.files[0]; if(!f) return;
    e.target.value='';
    try{
      var bmp = await createImageBitmap(f);
      var c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
      c.getContext('2d').drawImage(bmp,0,0);
      $('#err').textContent='分析中…（第一次要下載辨識模型）';
      var d = await Promise.race([ensureDetector(), new Promise(function(r){ setTimeout(function(){ r(null); }, 20000); })]);
      var ai=[];
      if(d){
        detBusy=true;
        try{
          await d.setOptions({runningMode:'IMAGE'});
          ai = toBoxes(d.detect(c).detections, {x:0, y:0, w:c.width, h:c.height});
          await d.setOptions({runningMode:'VIDEO'});
        }catch(err){ console.warn(err); }
        detBusy=false;
      }
      var boxes = mergeBoxes(ai, blobs(measure(c, {x:0, y:0, w:c.width, h:c.height})));
      state.mainRef=null; state.manual=false; state.planSig='';
      boxes.forEach(function(b,i){ b.id='a'+i; });
      pickMain(boxes);
      $('#err').textContent='';
      finish(c, URL.createObjectURL(f), {noAngle:true, boxes:boxes, note:'相簿照片沒有角度資料，所以只評光線、構圖和清晰度。長按照片可儲存（儲存的照片不含標示）。'});
    }catch(err){
      $('#err').textContent='這張照片讀不進來，換一張試試。';
    }
  });

  $('#again').addEventListener('click', function(){ if(state.stream) show('cam'); else show('start'); });
  $('#home').addEventListener('click', function(){ stopCam(); show('start'); });
})();
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
